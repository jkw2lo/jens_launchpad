  <!--
    A gallery of projects for other people: no launch counts, no settings.
      showcase.html                     every project that has an overview
      showcase.html?p=a,b,c             just those repos, in that order
      &t=Title  &i=A line of intro      optional heading and intro
      &v=side  &h=3                     a fixed list beside one scrolling container; the first 3 get full detail
      &v=grid | feature | list          the layout: cards, the first one large, or rows
      &w=1                              open on a welcome screen
      &k=code  &n=Name                  a tracked link: the welcome screen's button also records
                                        one visit (the code and the time, nothing else)
      showcase.html?code                a short tracked link: everything above is saved under the
                                        code in Firestore's showcase_links, readable by its code
    Make a link from the launchpad: Customize → Share.
  -->
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --band: #f4f3ef;
      --name-mix: 84%;
      --ink: #15171b;
      --muted: #62666f;
      --line: rgba(21, 23, 27, 0.09);
      --shadow: 0 1px 2px rgba(21, 23, 27, 0.04), 0 12px 32px -14px rgba(21, 23, 27, 0.18);
      --shadow-hover: 0 2px 4px rgba(21, 23, 27, 0.05), 0 22px 44px -16px rgba(21, 23, 27, 0.26);
      --font: "Manrope", system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111214;
        --card: #1a1c20;
      --band: #23262b;
      --name-mix: 62%;
        --band: #23262b;
        --name-mix: 62%;
        --ink: #eceef1;
        --muted: #a0a5ae;
        --line: rgba(236, 238, 241, 0.1);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -14px rgba(0, 0, 0, 0.6);
        --shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.35), 0 22px 44px -16px rgba(0, 0, 0, 0.75);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #111214;
      --card: #1a1c20;
      --ink: #eceef1;
      --muted: #a0a5ae;
      --line: rgba(236, 238, 241, 0.1);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px -14px rgba(0, 0, 0, 0.6);
      --shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.35), 0 22px 44px -16px rgba(0, 0, 0, 0.75);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    /* hidden must win over the display set on .welcome and friends */
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.55 var(--font); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    img { display: block; max-width: 100%; }
    .page { max-width: 1160px; margin: 0 auto; padding: 48px 24px 64px; }
    @media (max-width: 599px) { .page { padding: 28px 16px 40px; } }

    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px 32px; margin-bottom: 32px; }
    .head-right { display: flex; align-items: center; gap: 18px; }
    .theme-btn { display: inline-grid; place-items: center; flex: none; width: 34px; height: 34px; padding: 0; background: transparent; color: var(--muted); border: 1.5px solid var(--line); border-radius: 999px; cursor: pointer; }
    .theme-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @media (hover: hover) { .theme-btn:hover { color: var(--ink); border-color: currentColor; } }
    .theme-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    h1 { margin: 0; font-size: clamp(2rem, 1.5rem + 2.2vw, 3rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
    .intro { margin: 12px 0 0; max-width: 60ch; color: var(--muted); font-size: 1.08rem; }
    .count { margin: 10px 0 0; color: var(--muted); font-size: 0.85rem; font-weight: 600; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 22px; margin: 0; padding: 0; list-style: none; }
    .card {
      --accent: #4f6bdc;
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
      transition: transform 0.18s cubic-bezier(.2, .8, .2, 1), box-shadow 0.18s ease;
    }
    @media (hover: hover) { .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); } }
    .shot {
      position: relative; display: block; aspect-ratio: 16 / 10; overflow: hidden;
      background: color-mix(in srgb, var(--accent) 12%, var(--card));
      border-bottom: 1px solid var(--line);
    }
    .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
    /* a phone screenshot sits whole in the middle rather than being cropped to a sliver */
    .shot.phone img { width: auto; height: 92%; margin: 4% auto 0; object-fit: contain; border-radius: 14px 14px 0 0; box-shadow: 0 8px 24px -10px rgba(0, 0, 0, 0.35); }
    .shot.none { display: grid; place-items: center; }
    .shot.none svg { width: 56px; height: 56px; fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .flag { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px 5px 8px; border-radius: 999px; background: var(--accent); color: var(--on-accent, #fff); font-size: 0.74rem; font-weight: 800; box-shadow: 0 4px 12px -4px rgba(0, 0, 0, 0.4); }
    .shot .flag svg { width: 12px; height: 12px; fill: currentColor; stroke: none; }
    .shot:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

    .body { display: flex; flex-direction: column; flex: 1; gap: 6px; padding: 20px 22px 22px; }
    .top { display: flex; align-items: center; gap: 10px; }
    .top h2 { margin: 0; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
    .pill { margin-left: auto; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, var(--card)); color: color-mix(in srgb, var(--accent) 75%, var(--ink)); font-size: 0.72rem; font-weight: 700; white-space: nowrap; }
    .tagline { margin: 0; color: color-mix(in srgb, var(--accent) 75%, var(--ink)); font-weight: 700; font-size: 0.95rem; }
    .pitch { margin: 2px 0 0; color: var(--muted); font-size: 0.93rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 16px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--line); font: 700 0.88rem/1 var(--font); text-decoration: none; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); }
    @media (hover: hover) { .btn.primary:hover { filter: brightness(1.08); } .btn.ghost:hover { background: var(--line); } }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    /* Featured: the first project gets a wide card across the top */
    @media (min-width: 760px) {
      .grid.feature > .card:first-child { grid-column: 1 / -1; flex-direction: row; }
      .grid.feature > .card:first-child .shot { flex: 0 0 58%; aspect-ratio: auto; min-height: 340px; border-bottom: 0; border-right: 1px solid var(--line); }
      .grid.feature > .card:first-child .shot.phone { display: flex; align-items: flex-end; justify-content: center; max-height: 460px; }
      .grid.feature > .card:first-child .shot.phone img { height: auto; max-height: 420px; max-width: 60%; margin: 28px auto 0; }
      .grid.feature > .card:first-child .body { padding: 32px; justify-content: center; }
      .grid.feature > .card:first-child h2 { font-size: 1.7rem; }
      .grid.feature > .card:first-child .tagline { font-size: 1.1rem; }
      .grid.feature > .card:first-child .pitch { font-size: 1.02rem; }
      .grid.feature > .card:first-child .actions { margin-top: 10px; }
    }
    /* List: one project per row, the picture beside the words */
    .grid.list { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    @media (min-width: 700px) {
      .grid.list > .card { flex-direction: row; }
      .grid.list .shot { flex: 0 0 40%; aspect-ratio: 16 / 10; border-bottom: 0; border-right: 1px solid var(--line); }
      .grid.list .body { padding: 24px 28px; justify-content: center; }
      .grid.list .actions { margin-top: 8px; }
    }

    /* Tracked links open on a welcome card; its button records the visit */
    .welcome { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
    .welcome-card {
      width: min(560px, 100%); padding: 40px 36px 32px; text-align: left;
      background: var(--card); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow);
    }
    @media (max-width: 599px) { .welcome-card { padding: 30px 22px 24px; } }
    .welcome-hi { margin: 0 0 6px; color: var(--muted); font-size: 1.05rem; font-weight: 600; }
    .welcome h1 { font-size: clamp(1.9rem, 1.5rem + 1.8vw, 2.6rem); }
    .welcome .intro { margin-top: 12px; }
    .welcome-strip { display: flex; gap: 8px; margin: 26px 0 28px; }
    .welcome-strip span { flex: 1; height: 8px; border-radius: 4px; }
    .go {
      display: inline-flex; align-items: center; gap: 8px; padding: 14px 24px;
      background: var(--ink); color: var(--bg); border: 0; border-radius: 999px;
      font: 700 1rem/1 var(--font); cursor: pointer;
    }
    @media (hover: hover) { .go:hover { opacity: 0.88; } }
    .go:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .go svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .contact { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.92rem; }
    .contact strong { color: var(--ink); font-weight: 800; }
    .contact a { font-weight: 700; text-decoration: none; border-bottom: 1.5px solid var(--line); }
    @media (hover: hover) { .contact a:hover { color: var(--ink); border-color: currentColor; } }
    /* ---------- the side-list layout: a fixed list beside one scrolling container ---------- */
    .page.side-page { max-width: 1280px; }
    .page.side-page header { margin-bottom: 22px; }
    .contact.top { margin: 0; padding: 0; border: 0; }
    .contact.top span { display: none; }
    .side-wrap { display: grid; grid-template-columns: minmax(0, 1fr); }
    .side-nav { display: none; }
    .side-label { margin: 0 0 6px; color: var(--muted); font-size: 0.8rem; font-weight: 700; }
    .side-nav ul { margin: 0 0 22px; padding: 0; list-style: none; border-left: 2px solid var(--line); }
    .side-nav a { display: flex; align-items: center; gap: 7px; margin-left: -2px; padding: 7px 0 7px 14px; border-left: 2px solid transparent; color: var(--muted); font-weight: 600; text-decoration: none; }
    .side-nav .also a { padding-block: 4px; font-size: 0.88rem; font-weight: 500; }
    @media (hover: hover) { .side-nav a:hover { color: var(--ink); } }
    .side-nav a[aria-current="true"] { color: color-mix(in srgb, var(--accent) var(--name-mix), var(--ink)); border-left-color: var(--accent); font-weight: 800; }
    .side-nav a:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 6px; }
    .side-nav svg { flex: none; width: 11px; height: 11px; fill: currentColor; }
    .side-box { position: relative; min-width: 0; }
    .side-scroll { overflow: clip; background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
    .side-scroll:focus-visible { outline: 3px solid var(--line); outline-offset: 2px; }
    .side-cue { display: none; }
    .proj { padding: 24px 22px 30px; }
    .proj.band { background: var(--band); }
    .proj-shot { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
    .proj-shot img { width: 100%; height: auto; }
    .proj-shot.phone { max-width: 280px; margin-inline: auto; }
    .proj-top { display: grid; gap: 18px 30px; align-items: center; }
    .proj-title { margin-bottom: 18px; }
    .proj h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 0; color: color-mix(in srgb, var(--accent) var(--name-mix), var(--ink)); font-size: 1.75rem; font-weight: 800; letter-spacing: -0.025em; line-height: 1.2; }
    .proj-pitch { margin: 6px 0 0; max-width: 72ch; font-size: 1.05rem; }
    .proj-why { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .proj-why b { color: var(--ink); font-weight: 700; }
    .proj .actions { margin-top: 0; padding-top: 14px; }
    .proj .flag { position: static; box-shadow: none; letter-spacing: 0; white-space: nowrap; }
    .proj .flag svg { width: 12px; height: 12px; fill: currentColor; stroke: none; }
    .feat { display: grid; gap: 18px 32px; margin-top: 30px; align-items: center; }
    .feat h3 { margin: 0; font-size: 1.1rem; font-weight: 800; letter-spacing: -0.015em; }
    .feat p { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
    .feat ul { margin: 8px 0 0; padding-left: 18px; font-size: 0.9rem; }
    .feat li + li { margin-top: 3px; }
    .feat-plain { display: grid; gap: 20px 32px; margin-top: 30px; }
    .feat-plain .feat { display: block; margin: 0; }
    .proj-more { display: grid; gap: 18px; margin-top: 30px; }
    .proj-facts { margin: 24px 0 0; color: var(--muted); font-size: 0.85rem; }
    .also-head { margin: 0; padding: 26px 22px 14px; color: var(--muted); font-size: 1rem; font-weight: 800; }
    .proj.small h2 { font-size: 1.25rem; }
    .proj.small .proj-pitch { font-size: 0.95rem; }
    .proj.small .proj-why { font-size: 0.88rem; }
    button.btn { background: none; color: inherit; cursor: pointer; }
    .proj-details .feat:first-child, .proj-details .feat-plain:first-child { margin-top: 26px; }
    .proj-hide { margin-top: 20px; }
    @media (min-width: 700px) {
      .proj-top { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
      .proj.small .proj-top { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
      .proj-top > div:only-child { grid-column: 1 / -1; }
      .feat.pic { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
      .feat-plain { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .proj-more.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    /* Wide enough: the page stops scrolling, and only the container does */
    @media (min-width: 900px) and (min-height: 560px) {
      html:has(.side-page), html:has(.side-page) body { height: 100%; overflow: hidden; }
      .page.side-page { display: flex; flex-direction: column; height: 100dvh; padding: 30px 24px 24px; }
      .page.side-page header { flex: none; flex-wrap: nowrap; }
      .side-page h1 { font-size: 2.3rem; }
      .side-page .intro { max-width: none; margin-top: 6px; font-size: 1rem; }
      .side-wrap { flex: 1; min-height: 0; grid-template-columns: 210px minmax(0, 1fr); gap: 32px; }
      .side-nav { display: block; overflow-y: auto; padding-top: 4px; }
      .side-box { min-height: 0; }
      .side-scroll { height: 100%; overflow: hidden auto; overscroll-behavior: contain; scrollbar-width: thin; }
      .proj { padding: 28px 30px 34px; }
      .also-head { padding-inline: 30px; }
      .side-cue {
        position: absolute; left: 1px; right: 1px; bottom: 1px; display: flex; justify-content: center; align-items: flex-end;
        height: 76px; padding-bottom: 12px; border-radius: 0 0 22px 22px; pointer-events: none;
        background: linear-gradient(to bottom, transparent, var(--card) 72%); transition: opacity 0.2s ease;
      }
      .side-cue span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-size: 0.8rem; font-weight: 700; transition: opacity 0.2s ease; }
      .side-cue svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .side-box.scrolled .side-cue span { opacity: 0; }
      .side-box.at-end .side-cue { opacity: 0; }
    }
    @media (min-width: 900px) and (min-height: 560px) and (prefers-reduced-motion: no-preference) { .side-scroll { scroll-behavior: smooth; } }
    .empty { padding: 48px 24px; text-align: center; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 22px; }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <section class="welcome" id="welcome" hidden>
    <div class="welcome-card">
      <p class="welcome-hi" id="welcomeHi" hidden></p>
      <h1 id="welcomeTitle"></h1>
      <p class="intro" id="welcomeIntro" hidden></p>
      <div class="welcome-strip" id="welcomeStrip" aria-hidden="true"></div>
      <button type="button" class="go" id="go"></button>
    </div>
  </section>
  <div class="page" id="page">
    <header>
      <div>
        <h1 id="title">Projects</h1>
        <p class="intro" id="intro" hidden></p>
        <p class="count" id="count"></p>
      </div>
      <div class="head-right" id="headRight"><button type="button" class="theme-btn" id="themeBtn"></button></div>
    </header>
    <ul class="grid" id="grid" aria-live="polite"></ul>
    <div class="side-wrap" id="side" hidden></div>
    <footer class="contact" id="contact" hidden></footer>
  </div>

  <script src="js/projects.js?v=202611070339"></script>
  <script>
  (function () {
    "use strict";
    var OWNER = window.GITHUB_USER || "";
    var DOCS = "https://firestore.googleapis.com/v1/projects/github-projects-5d4e4/databases/(default)/documents/";
    var API_KEY = "AIzaSyBeIyBs3FtSx9T_wlJHsCqkfxZkhbX3Qhk";

    // Who made it and how to reach them: window.CONTACT in projects.js
    window.showContact(document.getElementById("contact"));
    window.themeButton(document.getElementById("themeBtn"));

    // A short link (showcase.html?h0udkw) is just a code; its settings are saved in
    // showcase_links/{code}, which anyone with the code can read (and nobody can list).
    var short = /^[a-z0-9]{4,24}$/i.test(location.search.slice(1)) ? location.search.slice(1) : "";
    if (!short) start(new URLSearchParams(location.search));
    else fetch(DOCS + "showcase_links/" + short + "?key=" + API_KEY)
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (doc) {
        var f = doc.fields || {}, q = new URLSearchParams();
        var sv = function (x) { return (x && x.stringValue) || ""; };
        var p = ((f.p && f.p.arrayValue && f.p.arrayValue.values) || []).map(sv).filter(Boolean);
        if (p.length) q.set("p", p.join(","));
        ["t", "i", "v", "n", "h"].forEach(function (k) { if (sv(f[k])) q.set(k, sv(f[k])); });
        if (f.w && f.w.booleanValue) q.set("w", "1");
        var g = ((f.g && f.g.arrayValue && f.g.arrayValue.values) || []).map(sv).filter(Boolean);
        if (g.length) q.set("g", g.join(","));
        q.set("k", short);
        start(q);
      })
      .catch(function () {
        document.getElementById("title").textContent = "Link not found";
        document.getElementById("grid").innerHTML = '<li class="empty">This link isn\'t available any more.</li>';
      });

    function start(params) {
    var byRepo = {};
    (window.PROJECTS || []).forEach(function (p) { byRepo[p.repo] = p; });

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    var str = function (v, max) { return typeof v === "string" ? v.trim().slice(0, max) : ""; };
    var validRepo = function (r) { return /^[A-Za-z0-9._-]+$/.test(r); };
    function safeUrl(u, base) {
      try { var url = new URL(u, base); return /^https?:$/.test(url.protocol) ? url.href : ""; } catch (e) { return ""; }
    }
    function inkOn(hex) {
      var n = parseInt(hex.slice(1), 16);
      var rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
        v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2] > 0.4 ? "#15171b" : "#ffffff";
    }
    var svg = function (path) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + path + "</svg>"; };
    var ARROW = svg('<path d="M5 12h14M13 6l6 6-6 6"/>');
    var PLAY = svg('<path d="M8 5.5v13l10-6.5z"/>');

    // Which projects: ?p= wins, then window.SHOWCASE in projects.js, then every project
    // with an overview (the ones without one are only included when named).
    var named = (params.get("p") || "").split(",").map(function (s) { return s.trim(); }).filter(validRepo);
    var preset = window.SHOWCASE || {};
    if (!named.length && Array.isArray(preset.projects)) named = preset.projects.filter(validRepo);
    var everything = !named.length;
    var repos = everything ? (window.PROJECTS || []).map(function (p) { return p.repo; }) : named;

    // A link with its own ?p= says everything itself; window.SHOWCASE is only for the plain page
    if (params.get("p")) preset = {};
    var title = str(params.get("t"), 80) || str(preset.title, 80) || "Projects";
    var view = params.get("v") || preset.view || "grid";
    if (view === "feature" || view === "list") document.getElementById("grid").classList.add(view);
    var intro = str(params.get("i"), 280) || str(preset.intro, 280);
    // ?g= flags the projects that have a guided demo; projects.js can give a demo its own url
    var demos = (params.get("g") || "").split(",").map(function (s) { return s.trim(); }).filter(validRepo);
    if (Array.isArray(preset.demos)) demos = preset.demos.filter(validRepo);
    document.getElementById("title").textContent = title;
    document.title = title;
    if (intro) { var el = document.getElementById("intro"); el.textContent = intro; el.hidden = false; }

    // Discovered repos aren't in projects.js; for "everything", ask GitHub for the rest,
    // using the launchpad's cached list when this browser has one.
    function allRepos() {
      if (!everything || !OWNER) return Promise.resolve(repos);
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem("jens_launchpad:repos")); } catch (e) {}
      var list = cached && Array.isArray(cached.list) ? Promise.resolve(cached.list)
        : fetch("https://api.github.com/users/" + encodeURIComponent(OWNER) + "/repos?per_page=100")
            .then(function (r) { return r.ok ? r.json() : []; })
            .then(function (l) { return l.filter(function (r) { return r.has_pages && !r.fork && !r.archived; }).map(function (r) { return { name: r.name }; }); })
            .catch(function () { return []; });
      return list.then(function (l) {
        l.forEach(function (r) { if (repos.indexOf(r.name) < 0 && r.name !== "jens_launchpad") repos.push(r.name); });
        return repos;
      });
    }

    // A repo with neither an overview nor a projects.js entry still gets its GitHub
    // description as a tagline, as it does on the launchpad.
    var pretty = function (n) { return n.replace(/[-_]+/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); }); };
    function describe(repo) {
      if (byRepo[repo] || !OWNER) return Promise.resolve("");
      return fetch("https://api.github.com/repos/" + encodeURIComponent(OWNER) + "/" + encodeURIComponent(repo))
        .then(function (r) { return r.ok ? r.json() : {}; }, function () { return {}; })
        .then(function (j) { return typeof j.description === "string" ? j.description : ""; });
    }
    function load(repo) {
      return fetch("../" + repo + "/overview/overview.json", { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (d) {
          if (d) return { repo: repo, d: d };
          return describe(repo).then(function (desc) { return { repo: repo, d: null, desc: desc }; });
        });
    }

    var here = location.pathname.split("/").pop() + location.search;
    function card(x) {
      var p = byRepo[x.repo] || {}, d = x.d || {};
      var name = projectName(x);
      var tagline = str(d.tagline, 60) || p.blurb || str(x.desc, 120);
      var accent = /^#[0-9a-f]{6}$/i.test(d.accent || "") ? d.accent : "#4f6bdc";
      var open = p.url || "https://" + OWNER + ".github.io/" + x.repo + "/";
      var demo = demos.indexOf(x.repo) >= 0;
      if (demo && p.demo) open = safeUrl(p.demo, open) || open;
      var about = x.d ? "overview.html?p=" + encodeURIComponent(x.repo) + "&back=" + encodeURIComponent(here) : "";
      var shot = (Array.isArray(d.screens) && d.screens[0]) || null;
      var src = shot && safeUrl(str(shot.src, 300), new URL("../" + x.repo + "/overview/", location.href).href);
      var icon = window.ICONS && (window.ICONS[p.icon] || window.ICONS.spark);
      var picture = src
        // behind a welcome card, load the pictures now so the gallery is ready on the click
        ? '<img src="' + esc(src) + '" alt="' + esc(str(shot.alt, 200)) + '" loading="' + (gate ? "eager" : "lazy") + '">'
        : (icon ? svg(icon) : "");
      var shotTag = about ? "a" : "div";
      return '<li class="card" style="--accent:' + accent + ";--on-accent:" + inkOn(accent) + '">' +
        "<" + shotTag + ' class="shot' + (src ? (shot.frame === "phone" ? " phone" : "") : " none") + '"' +
          (about ? ' href="' + esc(about) + '" aria-label="About ' + esc(name) + '"' : "") + ">" + picture +
          (demo ? '<span class="flag">' + PLAY + "Guided demo</span>" : "") + "</" + shotTag + ">" +
        '<div class="body">' +
          '<div class="top"><h2>' + esc(name) + "</h2>" + (str(d.status, 30) ? '<span class="pill">' + esc(str(d.status, 30)) + "</span>" : "") + "</div>" +
          (tagline ? '<p class="tagline">' + esc(tagline) + "</p>" : "") +
          (str(d.pitch) ? '<p class="pitch">' + esc(str(d.pitch, 200)) + "</p>" : "") +
          '<div class="actions">' +
            '<a class="btn primary" href="' + esc(open) + '">' + (demo ? "Try the guided demo " : "Open ") + ARROW + "</a>" +
            (about ? '<a class="btn ghost" href="' + esc(about) + '">About</a>' : "") +
          "</div>" +
        "</div>" +
      "</li>";
    }

    function projectName(x) { return str((x.d || {}).name, 60) || (byRepo[x.repo] || {}).name || pretty(x.repo); }

    // The side-list layout (&v=side): the first &h= projects are highlights with their full
    // detail; the rest go under "Also built" with theirs behind a button. It replaces the About page's role.
    var highlights = Math.max(1, Math.min(+params.get("h") || +preset.highlights || 3, 30));
    function picture(s, repo) {
      var url = s && safeUrl(str(s.src, 300), new URL("../" + repo + "/overview/", location.href).href);
      return url ? '<div class="proj-shot' + (s.frame === "phone" ? " phone" : "") + '"><img src="' + esc(url) + '" alt="' + esc(str(s.alt, 200)) + '" loading="lazy"></div>' : "";
    }
    function feature(f, repo) {
      var shot = f.screen ? picture(f.screen, repo) : "";
      var items = (Array.isArray(f.details) ? f.details : []).slice(0, 3).map(function (t) { return str(t, 90); }).filter(Boolean);
      return '<div class="feat' + (shot ? " pic" : "") + '"><div><h3>' + esc(str(f.title, 30)) + "</h3>" +
        (str(f.text) ? "<p>" + esc(str(f.text, 100)) + "</p>" : "") +
        (items.length ? "<ul>" + items.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>" : "") +
        "</div>" + shot + "</div>";
    }
    function sideEntry(x, i) {
      var p = byRepo[x.repo] || {}, d = x.d || {}, name = projectName(x), main = i < highlights;
      var accent = /^#[0-9a-f]{6}$/i.test(d.accent || "") ? d.accent : "#4f6bdc";
      var screens = Array.isArray(d.screens) ? d.screens : [];
      var demo = demos.indexOf(x.repo) >= 0;
      var open = p.url || "https://" + OWNER + ".github.io/" + x.repo + "/";
      if (demo && p.demo) open = safeUrl(p.demo, open) || open;
      var problem = str(d.problem, 100) || (d.problem && str(d.problem.headline, 100)) || "";
      var pitch = str(d.pitch, 200) || p.blurb || str(x.desc, 120);
      var why = problem ? '<p class="proj-why"><b>Why I built it:</b> ' + esc(problem) + "</p>" : "";
      var features = (Array.isArray(d.features) ? d.features : []).slice(0, 4).filter(function (f) { return f && str(f.title); });
      var withPic = features.filter(function (f) { return f.screen; }), plain = features.filter(function (f) { return !f.screen; });
      var f = d.facts || {};
      var facts = [f.worksOn, f.data, f.builtWith, str(f.started) ? "Since " + str(f.started) : ""].map(function (t) { return str(t, 40); }).filter(Boolean);
      var extra = screens.slice(1, 3).map(function (s) { return picture(s, x.repo); }).filter(Boolean);
      var detail = withPic.map(function (t) { return feature(t, x.repo); }).join("") +
        (plain.length ? '<div class="feat-plain">' + plain.map(function (t) { return feature(t, x.repo); }).join("") + "</div>" : "") +
        (extra.length ? '<div class="proj-more' + (extra.length > 1 ? " two" : "") + '">' + extra.join("") + "</div>" : "") +
        (facts.length ? '<p class="proj-facts">' + esc(facts.join(" · ")) + "</p>" : "");
      var fold = !main && detail; // the rest keep their detail behind a button
      var buttons = '<div class="actions"><a class="btn primary" href="' + esc(open) + '">Open ' + ARROW + "</a>" +
        (OWNER ? '<a class="btn ghost" href="https://github.com/' + esc(OWNER) + "/" + esc(x.repo) + '">Source</a>' : "") +
        (fold ? '<button type="button" class="btn ghost" data-details="' + esc(x.repo) + '" aria-expanded="false" aria-controls="d-' + esc(x.repo) + '">See details</button>' : "") + "</div>";
      return '<section class="proj' + (main ? "" : " small") + (i % 2 ? " band" : "") + '" id="p-' + esc(x.repo) + '" data-repo="' + esc(x.repo) + '" style="--accent:' + accent + ";--on-accent:" + inkOn(accent) + '">' +
        '<div class="proj-title"><h2>' + esc(name) + (demo ? ' <span class="flag">' + PLAY + "Guided demo</span>" : "") + "</h2>" +
          (pitch ? '<p class="proj-pitch">' + esc(pitch) + "</p>" : "") + "</div>" +
        '<div class="proj-top">' + picture(screens[0], x.repo) + "<div>" + why + buttons + "</div></div>" +
        (fold ? '<div class="proj-details" id="d-' + esc(x.repo) + '" hidden>' + detail +
          '<button type="button" class="btn ghost proj-hide" data-details="' + esc(x.repo) + '">Hide details</button></div>' : detail) + "</section>";
    }
    function renderSide(shown) {
      var side = document.getElementById("side"), page = document.getElementById("page");
      var navItem = function (x) {
        var a = /^#[0-9a-f]{6}$/i.test((x.d || {}).accent || "") ? x.d.accent : "#4f6bdc";
        return '<li><a href="#p-' + esc(x.repo) + '" data-repo="' + esc(x.repo) + '" style="--accent:' + a + '">' + esc(projectName(x)) +
          (demos.indexOf(x.repo) >= 0 ? PLAY : "") + "</a></li>";
      };
      var top = shown.slice(0, highlights), also = shown.slice(highlights);
      side.innerHTML = '<nav class="side-nav" aria-label="Projects">' +
        (also.length ? '<p class="side-label">Highlights</p>' : "") + "<ul>" + top.map(navItem).join("") + "</ul>" +
        (also.length ? '<p class="side-label">Also built</p><ul class="also">' + also.map(navItem).join("") + "</ul>" : "") + "</nav>" +
        '<div class="side-box"><div class="side-scroll" tabindex="0" role="region" aria-label="Project details">' +
          top.map(sideEntry).join("") +
          (also.length ? '<h2 class="also-head">Also built</h2>' + also.map(function (x, i) { return sideEntry(x, i + highlights); }).join("") : "") +
        "</div><div class=\"side-cue\" aria-hidden=\"true\"><span>Scroll for more " + svg('<path d="M12 5v14M6 13l6 6 6-6"/>') + "</span></div></div>";
      page.classList.add("side-page");
      document.getElementById("grid").hidden = true;
      side.hidden = false;
      var contact = document.getElementById("contact");
      contact.classList.add("top");
      var right = document.getElementById("headRight");
      right.insertBefore(contact, right.firstChild);

      // The list follows the scrolling; a clicked name stays lit until the visitor scrolls again
      var box = side.querySelector(".side-box"), scroller = side.querySelector(".side-scroll");
      var entries = [].slice.call(scroller.querySelectorAll(".proj")), links = [].slice.call(side.querySelectorAll(".side-nav a"));
      var clicked = "";
      function mark() {
        var line = scroller.getBoundingClientRect().top + scroller.clientHeight * 0.3, cur = entries[0] && entries[0].dataset.repo;
        entries.forEach(function (s) { if (s.getBoundingClientRect().top < line) cur = s.dataset.repo; });
        var atEnd = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 24;
        if (atEnd && entries.length) cur = entries[entries.length - 1].dataset.repo;
        if (clicked) cur = clicked;
        links.forEach(function (a) { if (a.dataset.repo === cur) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); });
        box.classList.toggle("scrolled", scroller.scrollTop > 40);
        box.classList.toggle("at-end", atEnd);
      }
      function align() {
        var target = document.getElementById("p-" + clicked);
        if (target) scroller.scrollTop += target.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
      }
      scroller.addEventListener("scroll", mark, { passive: true });
      ["wheel", "touchstart", "keydown", "pointerdown"].forEach(function (t) { scroller.addEventListener(t, function () { clicked = ""; }, { passive: true }); });
      window.addEventListener("resize", mark);
      scroller.addEventListener("click", function (e) {
        var b = e.target.closest("[data-details]");
        if (!b) return;
        var panel = document.getElementById("d-" + b.dataset.details), entry = document.getElementById("p-" + b.dataset.details);
        var top = entry.querySelector(".actions [data-details]"), open = panel.hidden;
        panel.hidden = !open;
        top.setAttribute("aria-expanded", String(open));
        top.textContent = open ? "Hide details" : "See details";
        // Closing from further down: come back to the project rather than land somewhere else
        var limit = getComputedStyle(scroller).overflowY === "visible" ? 0 : scroller.getBoundingClientRect().top;
        if (!open && entry.getBoundingClientRect().top < limit) entry.scrollIntoView({ block: "start" });
        if (!open) top.focus({ preventScroll: true });
        mark();
      });
      side.querySelector(".side-nav").addEventListener("click", function (e) {
        var a = e.target.closest("a");
        if (!a) return;
        if (!document.getElementById("p-" + a.dataset.repo) || getComputedStyle(scroller).overflowY === "visible") return;
        e.preventDefault();
        clicked = a.dataset.repo;
        align();
        mark();
      });
      // Pictures loading above a clicked project push it down, so keep lining it up
      scroller.addEventListener("load", function () { if (clicked) align(); mark(); }, true);
      mark();
    }

    // &w=1 opens on a welcome card. On a tracked link (&k=) the card is the same, and its
    // button also records one visit, straight to Firestore's REST API (no SDK for visitors).
    // Coming back in the same tab (say from an About page) skips the card and isn't counted again.
    var code = (params.get("k") || "").replace(/[^a-z0-9]/gi, "").slice(0, 24);
    var greet = str(params.get("n"), 40);
    var FIRESTORE = DOCS + "showcase_visits?key=" + API_KEY;
    var seenKey = "showcase:seen:" + (code || location.search), seen = false;
    try { seen = sessionStorage.getItem(seenKey) === "1"; } catch (e) {}
    function recordVisit() {
      try {
        fetch(FIRESTORE, {
          method: "POST", keepalive: true, headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fields: { k: { stringValue: code }, at: { timestampValue: new Date().toISOString() } } })
        }).catch(function () {});
      } catch (e) {}
    }
    var gate = (code || params.get("w") === "1") && !seen;
    if (gate) {
      document.getElementById("page").hidden = true;
      document.getElementById("welcome").hidden = false;
      if (greet) { var hi = document.getElementById("welcomeHi"); hi.textContent = "Hi " + greet + ","; hi.hidden = false; }
      document.getElementById("welcomeTitle").textContent = title;
      if (intro) { var wi = document.getElementById("welcomeIntro"); wi.textContent = intro; wi.hidden = false; }
      document.getElementById("go").innerHTML = "See the projects " + ARROW;
      document.getElementById("go").addEventListener("click", function () {
        if (code) recordVisit();
        try { sessionStorage.setItem(seenKey, "1"); } catch (e) {}
        document.getElementById("welcome").hidden = true;
        document.getElementById("page").hidden = false;
        window.scrollTo(0, 0);
      });
      document.getElementById("go").focus();
    }

    allRepos().then(function (list) { return Promise.all(list.map(load)); }).then(function (all) {
      var shown = everything ? all.filter(function (x) { return x.d; }) : all;
      var grid = document.getElementById("grid");
      var guided = shown.filter(function (x) { return demos.indexOf(x.repo) >= 0; }).length;
      document.getElementById("count").textContent = shown.length ? shown.length + (shown.length === 1 ? " project" : " projects") +
        (guided ? " · " + guided + " with a guided demo that walks you through " + (guided === 1 ? "it" : "them") : "") : "";
      if (view === "side" && shown.length) { document.getElementById("count").textContent = ""; renderSide(shown); }
      else grid.innerHTML = shown.length ? shown.map(card).join("") : '<li class="empty">Nothing to show here yet.</li>';
      // The welcome card's colour strip: one stripe per project, in its own accent
      if (gate) {
        document.getElementById("welcomeStrip").innerHTML = shown.map(function (x) {
          var a = x.d && /^#[0-9a-f]{6}$/i.test(x.d.accent || "") ? x.d.accent : "#9aa0aa";
          return '<span style="background:' + a + '"></span>';
        }).join("");
        document.getElementById("go").innerHTML = "See the " + (shown.length === 1 ? "project" : shown.length + " projects") + " " + ARROW;
      }
    });
    }
  })();
  </script>
</body>
</html>
