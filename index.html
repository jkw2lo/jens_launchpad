<!doctype html>
<html lang="en" data-skin="mist">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jen's Launchpad</title>
  <meta name="description" content="One page to open all of Jen's projects.">
  <meta name="theme-color" content="#f3f4f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Launchpad">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='%234f6bff'/%3E%3Crect x='18' y='2' width='12' height='12' rx='6' fill='%23ff5fa2'/%3E%3Crect x='2' y='18' width='12' height='12' rx='6' fill='%23ffb703'/%3E%3Crect x='18' y='18' width='12' height='12' rx='3' fill='%231d1b33'/%3E%3C/svg%3E">
  <script>
    // Apply the saved skin before first paint so there's no flash.
    try {
      var s = new URLSearchParams(location.search).get("skin") || JSON.parse(localStorage.getItem("jens_launchpad:skin"));
      if (s) document.documentElement.dataset.skin = s;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Jost:wght@400;500;700&family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style id="lookStyle"></style>
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1>Jen's Launchpad</h1>
      </div>
      <div class="top-right">
        <p class="summary" id="summary" aria-live="polite"></p>
        <button type="button" class="btn" id="customize" aria-pressed="false" aria-controls="editPanel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          <span class="label">Customize</span>
        </button>
      </div>
    </header>

    <ul class="legend" id="legend" aria-label="Project types"></ul>

    <section class="edit" id="editPanel" hidden aria-label="Customize">
      <details class="panel look" id="lookPanel">
        <summary>
          <span class="panel-title">Look</span>
          <span class="panel-note" id="lookNote"></span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </summary>
        <div class="look-body" id="lookBody"></div>
      </details>

      <div class="panel box" id="box">
        <div class="box-head">
          <span class="panel-title">The box</span>
          <span class="panel-note" id="boxNote"></span>
        </div>
        <ul class="box-items" id="boxItems"></ul>
      </div>

      <div class="panel account" id="account">
        <div class="box-head">
          <span class="panel-title">Sync</span>
          <span class="panel-note">Count launches across all your devices</span>
        </div>
        <div class="account-body" id="accountBody"></div>
      </div>

      <div class="edit-hint">
        <p><span class="hint-drag">Drag tiles to reorder</span><span class="hint-grip">Drag <b>⠿</b> to reorder</span> · <b>✕</b> puts a project back in the box.</p>
        <button type="button" class="btn ghost small" id="resetOrder">Reset order</button>
      </div>
    </section>

    <ul class="grid" id="grid" aria-label="Projects"></ul>

    <footer class="foot" id="foot"></footer>
  </div>

  <button type="button" class="btn primary done-fab" id="doneFab" hidden>Done</button>

  <script src="js/projects.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
